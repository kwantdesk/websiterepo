<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KWANTY · Kwant Desk</title><script src="/gex-data-app/site-bootstrap.js?v=2"></script><link rel="stylesheet" href="/workspace-loading.css?v=1"><link rel="stylesheet" href="/kwanty-app/styles.css"><link rel="stylesheet" href="/kwanty-app/site.css?v=5"><script type="module" src="/kwanty-app/site-runtime.js"></script></head>
<body>
<link rel="stylesheet" href="/gex-data-app/themed-select.css?v=2">
<script type="module" src="/gex-data-app/themed-select.js?v=3"></script>
<header><nav aria-label="positioning feed views"><button data-package="classic" class="selected">classic</button><button data-package="state">state</button><button data-package="orderflow">orderflow</button></nav><div class="chart-top-controls" role="toolbar" aria-label="Active chart controls"><span id="activeChartLabel" class="active-chart-label">classic</span><select id="candleInterval" aria-label="Candle interval"><option value="60000">1m</option><option value="120000">2m</option><option value="180000">3m</option><option value="300000">5m</option><option value="600000">10m</option><option value="900000">15m</option><option value="1800000">30m</option><option value="3600000">1h</option><option value="14400000">4h</option></select><div class="timeframe-buttons" role="group" aria-label="Candle timeframes"><button type="button" data-candle-interval="60000" aria-pressed="true">1m</button><button type="button" data-candle-interval="180000" aria-pressed="false">3m</button><button type="button" data-candle-interval="300000" aria-pressed="false">5m</button><button type="button" data-candle-interval="900000" aria-pressed="false">15m</button><button type="button" data-candle-interval="1800000" aria-pressed="false">30m</button><button type="button" data-candle-interval="3600000" aria-pressed="false">1h</button></div><div id="tickerFavourites" class="ticker-favourites" role="group" aria-label="Favourite tickers" hidden></div><select id="priceViewMode" aria-label="Price chart type"><option value="candles">Candles</option><option value="line">Line</option></select><button id="toggleSidebar" aria-label="Toggle controls" title="Show or hide settings">☷</button><button id="fullscreen" aria-label="Fullscreen chart" title="Fullscreen">⛶</button><button id="screenshot" aria-label="Download chart image" title="Save chart image">▣</button></div><div class="header-links"><button id="themeToggle" hidden>Theme</button></div></header>
<main>
 <section id="charts" aria-label="Market charts">
  <div id="chartPanels"></div><div id="chartEmpty" role="status"></div>
  <script type="module">import {showWorkspaceLoading} from '/workspace-loading.js?v=1';showWorkspaceLoading(document.querySelector('#chartEmpty'),'Loading KWANTY');</script>
  <div id="chartTooltip" role="tooltip" hidden></div>
 </section>
 <aside id="sidebar">
  <div class="side-heading"><h1 id="packageTitle">classic</h1><button id="openSettings" aria-label="Chart settings">⚙</button></div>
  <label class="ticker-label">ticker<select id="ticker" aria-label="Ticker"><option>SPX</option></select></label>
  <div class="segmented price-source"><button id="spotMode" class="selected">spot price</button><button id="futureMode" disabled>futures</button></div>
  <div id="profileControls">
   <div id="stateSections" hidden><h3 class="green">gex profile</h3></div>
   <div id="gexCategories" class="categories" role="group" aria-label="GEX expiry"><button data-category="gex_full" class="selected">90d (agg)</button><button data-category="gex_zero">latest</button><button data-category="gex_one">next</button></div>
   <div id="greekControls" hidden><h3 class="amber">options profile</h3><div class="greek-layout"><div class="categories"><button data-greek-expiry="zero" class="selected">latest</button><button data-greek-expiry="one">next</button></div><div class="greeks"><label><input type="checkbox" name="greek" value="delta"> delta</label><label><input type="checkbox" name="greek" value="gamma"> gamma</label><label><input type="checkbox" name="greek" value="vanna"> vanna</label><label><input type="checkbox" name="greek" value="charm"> charm</label></div></div><p class="small-note">Net Greek exposure. Classified call/put volume splits are not supplied by this public API.</p></div>
  </div>
  <div id="orderflowControls" hidden></div>
  <div id="summary" aria-live="polite"></div>
  <div class="history-controls"><button id="loadHistory">load history</button><input id="historyDate" type="date" aria-label="Historical session date"><button id="clearHistory">▤ clear history</button></div>
  <div id="playbar"><div class="play-top"><button id="liveButton" title="Return to current provider snapshots">Live</button><select id="replaySpeed" aria-label="Replay speed"><option value="1">1x</option><option value="5">5x</option><option value="10">10x</option><option value="30">30x</option><option value="60">60x</option></select><output id="replayTime">—</output></div><input id="timeline" type="range" min="0" max="0" value="0" aria-label="Replay timeline" disabled><div class="transport"><button data-seek="-30" aria-label="30 seconds rewind">◀◀</button><button data-seek="-1" aria-label="1 second rewind">◀</button><button id="playPause" aria-label="Play replay" disabled>▶</button><button data-seek="1" aria-label="1 second forward">▶</button><button data-seek="30" aria-label="30 seconds forward">▶▶</button></div></div>
  <div id="connection" hidden data-kwanty-diagnostic></div><p id="freshnessDetails" hidden data-kwanty-diagnostic></p>
 </aside>
</main>
<div id="message" role="alert" hidden></div>
<dialog id="settingsDialog" aria-labelledby="settingsTitle"><div class="dialog-head"><h2 id="settingsTitle">settings</h2><button id="closeSettings" aria-label="Close settings">×</button></div><form id="settingsForm"><div id="settingsRows"></div><fieldset id="chartTypeSettings"><legend>Chart Type</legend><label><input type="radio" name="spotViewMode" value="line"> Line</label><label><input type="radio" name="spotViewMode" value="candles"> Candles</label></fieldset><fieldset><legend>Price Transform</legend><label>Multiplier <input name="priceMultiplier" type="number" step="0.0001" value="1"></label><label>Offset <input name="priceOffset" type="number" step="0.01" value="0"></label></fieldset><fieldset id="alignmentSettings"><legend>Profile Alignment</legend><select name="alignment"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></fieldset><label class="setting-line">Time Zone<select name="timeZone"><option value="America/New_York">New York</option><option value="Australia/Brisbane">Brisbane</option><option value="UTC">UTC</option></select></label><footer><button id="resetSettings" type="button">RESET</button><button type="submit">SAVE</button></footer></form></dialog>
<script type="module" src="/kwanty-app/app.js?v=12"></script>
</body></html>
