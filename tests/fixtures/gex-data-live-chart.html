<!doctype html><html><head><meta charset="utf-8"><title>GEX DATA synthetic refresh QA</title></head>
<body style="margin:0;background:#111;color:white;font:14px sans-serif">
<div style="padding:12px">Synthetic test only — no market-data requests.
<button id="revise">Revise bucket and append interval</button> <output id="result">Waiting for chart</output></div>
<iframe title="Synthetic Net Drift" src="/gex-data-app/index.html?embed=1&instance=synthetic-refresh&c_ticker=SPY&c_period=1m#tool=net-drift" style="width:100%;height:850px;border:0"></iframe>
<script>
const saved=new Map();let revision=0;
window.__kwantGexDataHost={active:true,timezone:()=> 'America/New_York',theme:()=>({primary:'#aaaaaa',bullish:'#45ed86',bearish:'#ff5970',accent:'#62b7ff'}),instruments:()=>[['SPY','SPY']],read:key=>saved.get(key)??null,write:(key,value)=>{saved.set(key,value);localStorage.setItem('gex-data-synthetic-prefs',JSON.stringify([...saved]));},snapshot:()=>Object.fromEntries(saved),restore(){},
request:async url=>{
 const market={sessionDate:'2026-10-19',optionsSessionDate:'2026-10-19',open:true,optionsOpen:true,equitiesOpen:true};
 if(url.endsWith('/status'))return Response.json({connected:true,mode:'gateway',market});
 if(!url.endsWith('/net-drift'))throw Error('Unexpected synthetic request');
 const data={};for(let i=0;i<10+revision;i++)data[1792416600000+i*60000]={stockPrice:100+i/10,netCallPremium:i===9?100+revision*50:100,netPutPremium:i%2?-30:50,netCallVolume:20+i,netPutVolume:10+i};
 return Response.json({data,_gexData:{gatewayFetchedAt:new Date().toISOString(),requestedSessionDate:'2026-10-19'}});
}};
document.querySelector('#revise').onclick=()=>{
 const doc=document.querySelector('iframe').contentDocument,canvas=doc.querySelector('.quant-detail-chart'),slider=doc.querySelector('.zoom-gesture-handle'),oldMax=Number(slider?.getAttribute('aria-valuemax'));
 if(!canvas){document.querySelector('#result').textContent='Chart not ready';return;}
 revision++;doc.querySelector('#toolControls [aria-label="Refresh"], #toolControls [title="Refresh"]')?.click();
 // Refresh is a resolved synthetic Response, not a remote data timing test.
 setTimeout(()=>{const current=doc.querySelector('.quant-detail-chart'),newSlider=doc.querySelector('.zoom-gesture-handle');
 document.querySelector('#result').textContent=current===canvas&&newSlider===slider&&Number(slider.getAttribute('aria-valuemax'))===oldMax+1?'PASS: canvas and navigator retained; interval appended; storage echo settled':'FAIL: chart/navigator replaced or interval not appended';},750);
};
</script></body></html>
