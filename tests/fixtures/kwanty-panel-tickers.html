<!doctype html><html><head><meta charset="utf-8"><title>Isolated KWANTY multi-ticker QA</title><style>html,body{margin:0;height:100%;background:#080b12;color:white;font:12px sans-serif}header{height:32px}iframe{height:calc(100% - 32px);width:100%;border:0}</style></head><body>
<header>LOCAL UI TEST — synthetic prices/positioning, not market data <output id="saved"></output></header>
<script>
const seed={schemaVersion:2,ticker:'NDX',settings:{},activePanelId:'a',panels:[{id:'a',ticker:'NDX',metric:'gex-orderflow',period:23400,showSpot:true},{id:'b',ticker:'SPY',metric:'aggregate-dex',period:23400,showSpot:true},{id:'c',ticker:'QQQ',metric:'net-gex',period:23400,showSpot:true}]};
const values=new Map(Object.entries(JSON.parse(localStorage.getItem('kwanty-panel-ticker-qa')||'{}')));if(!values.has('kwanty:v1'))values.set('kwanty:v1',JSON.stringify(seed));
values.set('kwanty:select-preferences:v1',JSON.stringify({version:1,groups:{instruments:{favourites:['NDX','SPY','SPX','QQQ']}}}));
const base={NDX:20000,SPY:500,QQQ:400,SPX:6000},start=Date.parse('2026-10-19T13:30:00Z');
const frames=ticker=>Array.from({length:60},(_,i)=>({ticker,timestamp:(start+i*60000)/1000,spot:base[ticker]+i/10,gexoflow:i,agg_dex:i/2,z_ngamma:100+i,o_ngamma:20}));
const candles=ticker=>Array.from({length:60},(_,i)=>({time:start+i*60000,open:base[ticker]+i/10,high:base[ticker]+i/10+.3,low:base[ticker]+i/10-.2,close:base[ticker]+i/10+.1,volume:100}));
window.__kwantyHost={active:true,read:key=>values.get(key)||null,write:(key,value)=>{values.set(key,value);localStorage.setItem('kwanty-panel-ticker-qa',JSON.stringify(Object.fromEntries(values)));if(key==='kwanty:v1')document.querySelector('#saved').textContent=JSON.parse(value).panels.map(p=>p.ticker).join(' / ');},theme:()=>({background:'#080b12',panel:'#101725',surface:'#192234',foreground:'#e8edf5',muted:'#8997b0',border:'#34435c',primary:'#65caff',bullish:'#65caff',bearish:'#dd758d'}),timezone:()=> 'America/New_York',snapshot:()=>Object.fromEntries(values),restore:next=>Object.entries(next).forEach(([key,value])=>values.set(key,value)),priceHistory:async ticker=>candles(ticker),subscribePrice:()=>()=>{},request:async url=>{const q=new URLSearchParams(url.split('?')[1]),ticker=q.get('ticker');return new Response(JSON.stringify(url.includes('/catalog')?{tickers:Object.keys(base)}:url.includes('/status')?{authenticated:true}:{data:url.includes('/session')||url.includes('/history')?frames(ticker):frames(ticker).at(-1)}),{headers:{'Content-Type':'application/json'}});}};
</script><iframe title="KWANTY multi-ticker application" src="/kwanty-app/index.html?v=4#orderflow"></iframe></body></html>
