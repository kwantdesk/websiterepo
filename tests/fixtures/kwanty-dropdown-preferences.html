<!doctype html><html><head><meta charset="utf-8"><title>KWANTY dropdown QA</title><link rel="stylesheet" href="/gex-data-app/themed-select.css"><style>:root{--site-background:#080b12;--site-panel:#101725;--site-surface:#192234;--site-foreground:#e8edf5;--site-muted:#8997b0;--site-border:#2b3850;--site-primary:#65caff}body{margin:0;padding:24px;background:var(--site-background);color:var(--site-foreground);font:14px Arial,sans-serif}button{padding:8px;background:var(--site-surface);color:var(--site-foreground);border:1px solid var(--site-border)}#controls{margin-top:24px;width:300px}output{display:block;margin-top:20px;color:var(--site-muted)}</style></head><body><h1>KWANTY dropdown interaction QA</h1><p>Real dropdown adapter and preference model, isolated test account storage. No market-data requests.</p><nav><button data-view="Classic">Classic</button><button data-view="State">State</button><button data-view="Orderflow">Orderflow</button><button id="accountA">Use account A</button><button id="accountB">Use account B</button></nav><p id="view">Classic · account A</p><div id="controls"></div><output id="selection">No chart selection changes</output><script type="module">
import {createSelectPreferences} from '/kwanty-app/select-preferences.js';
import '/gex-data-app/themed-select.js';
let account='A',view='Classic',changes=0;
function render(){window.__kwantSelectPreferences=createSelectPreferences({getItem:key=>localStorage.getItem('kwanty-qa:'+account+':'+key),setItem:(key,value)=>localStorage.setItem('kwanty-qa:'+account+':'+key,value)});document.querySelector('#view').textContent=view+' · account '+account;const select=document.createElement('select');select.id='ticker';select.setAttribute('aria-label','Ticker');for(const value of ['ES','NDX','NQ','QQQ','SPX','YM']){const option=document.createElement('option');option.value=value;option.textContent=value;select.append(option);}select.addEventListener('change',()=>{changes++;document.querySelector('#selection').textContent='Selected '+select.value+' · Changes '+changes;});document.querySelector('#controls').replaceChildren(select);}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{view=button.dataset.view;render();};document.querySelector('#accountA').onclick=()=>{account='A';render();};document.querySelector('#accountB').onclick=()=>{account='B';render();};render();
</script></body></html>
