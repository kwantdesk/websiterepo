<!doctype html><html><head><meta charset="utf-8"><title>KWANTY State multi-panel QA</title><style>html,body{height:100%;margin:0;background:#090b10;color:#e8edf5;font:12px sans-serif}header{height:36px;display:flex;align-items:center;gap:12px;padding:0 12px}button{background:#18212f;color:inherit;border:1px solid #344055;padding:4px}iframe{width:100%;height:calc(100% - 105px);border:0}output{display:block;height:65px;overflow:auto;white-space:pre;font:11px monospace;padding:2px 10px}</style></head><body>
<header>State panels · synthetic data, isolated settings <button id="reload">Reload saved panels</button><button id="quote">Push QQQ price</button></header>
<iframe title="KWANTY actual multi-panel application" src="/kwanty-app/index.html?fixture=state-panels#state"></iframe><output id="proof"></output>
<script>
const store=new Map(),requests=[],subscriptions=new Map(),priceReads=[];let writes=0;
const start=Date.UTC(2026,9,20,13,30),stamp=(start+60*60000)/1000;
store.set('kwanty:v1',JSON.stringify({schemaVersion:2,ticker:'QQQ',scopes:{state:{gexCategory:'gex_full',greek:'gamma',greekExpiry:'zero'}},settings:{state:{}},panels:[],statePanels:[{id:'gamma',ticker:'QQQ',greek:'gamma',greekExpiry:'zero',gexCategory:'gex_full',height:1},{id:'delta',ticker:'NDX',greek:'delta',greekExpiry:'zero',gexCategory:'gex_full',height:1}],activeStatePanelId:'gamma'}));
store.set('kwanty:select-preferences:v1',JSON.stringify({version:1,groups:{instruments:{favourites:['QQQ','NDX','SPX','SPY'],recent:['QQQ'],showRecents:true}}}));
const base=ticker=>ticker==='NDX'?20000:ticker==='SPX'?6000:ticker==='SPY'?600:500;
function report(){const state=JSON.parse(store.get('kwanty:v1')||'{}');document.querySelector('#proof').textContent=JSON.stringify({writes,requests:requests.map(q=>q.ticker+'/'+q.category),priceReads,subscriptions:[...subscriptions.keys()],active:state.activeStatePanelId,panels:state.statePanels?.map(p=>({id:p.id,ticker:p.ticker,greek:p.greek,candleIntervalMs:p.candleIntervalMs,priceViewMode:p.priceViewMode,viewportLinked:p.viewportLinked,crosshairLinked:p.crosshairLinked,background:p.settings?.background}))});}
window.__kwantyHost={active:true,read:key=>store.get(key)||null,write:(key,value)=>{store.set(key,value);writes++;report();},theme:()=>({background:'#07090d',panel:'#0b0f16',surface:'#192334',foreground:'#e8edf5',muted:'#8e9db5',border:'#29364b',primary:'#55bdff',bullish:'#33b7a5',bearish:'#e97995'}),timezone:()=> 'America/New_York',snapshot:()=>Object.fromEntries(store),restore:next=>{for(const[k,v]of Object.entries(next))store.set(k,v);report();},
priceHistory:async ticker=>{priceReads.push(ticker);report();const n=base(ticker);return Array.from({length:61},(_,i)=>({time:start+i*60000,open:n+Math.sin(i/6)*3,high:n+Math.sin(i/6)*3+.7,low:n+Math.sin(i/6)*3-.7,close:n+Math.sin((i+1)/6)*3,volume:20}));},
subscribePrice:(ticker,callback)=>{subscriptions.set(ticker,callback);report();return()=>{subscriptions.delete(ticker);report();};},
request:async url=>{if(url.includes('/catalog'))return Response.json({tickers:['NDX','QQQ','SPX','SPY']});if(url.includes('/status'))return Response.json({authenticated:true});if(url.includes('/session'))return Response.json({data:[]});const q=Object.fromEntries(new URL(url,location.origin).searchParams),n=base(q.ticker);requests.push(q);report();const snapshot={ticker:q.ticker,category:q.category,timestamp:stamp,spot:n,mini_contracts:Array.from({length:17},(_,i)=>[n-8+i,.2,.22,Math.sin(i/2)*(q.category?.startsWith('delta')?20:45),[i,i/2,-i]]),strikes:Array.from({length:17},(_,i)=>[n-8+i,Math.sin(i/2)*45,15,[i,i/2,-i]]),min_dte:0,sec_min_dte:1};return Response.json({data:url.includes('/history')?[snapshot]:snapshot,providerAsOf:new Date(stamp*1000).toISOString(),fetchedAt:new Date(stamp*1000).toISOString()});}};
document.querySelector('#reload').onclick=()=>document.querySelector('iframe').contentWindow.location.reload();
document.querySelector('#quote').onclick=()=>{const listener=subscriptions.get('QQQ');if(listener)listener({symbol:'QQQ',timestamp:stamp*1000+100,lastPrice:501});};report();
</script></body></html>
